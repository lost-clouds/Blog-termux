name: Lint

on:
  pull_request:
    paths:
      - 'js/**/*.js'
      - 'css/src/**/*.css'
      - 'cron.sh'
      - 'gen_index.sh'
      - 'css/build.sh'
      - 'package.json'
      - '.eslintrc.json'
      - '.stylelintrc.json'
      - '.prettierrc'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Install dependencies
        run: npm install
      - name: Lint JS
        run: npm run lint:js
      - name: Lint CSS
        run: npm run lint:css
      - name: Lint Shell
        run: npm run lint:sh
