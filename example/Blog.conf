# ============================================================
# Blog Nginx 配置示例（适用于 Termux + Nginx）
# 部署时将所有 /path/to/Blog-termux 替换为实际项目绝对路径
#（与 README 的 sed 占位符一致：sed -i 's|/path/to/Blog-termux|/your/real/path|g'）
# ============================================================
server {
    listen 7443;
    charset utf-8;

    # ---- 安全响应头（server 层默认；自带 add_header 的 location 需重复声明）----
    # 注意：nginx 中 location 一旦出现 add_header，会整体覆盖 server 层继承的头，
    # 因此下方带 add_header 的 location（/api/dashboard、= /sw.js、= /index.html）
    # 内均重复声明了安全头。
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;

    # ---- 可选：启用 TLS（监听同端口 7443，需自备证书；默认明文仅限本机防护）----
    # listen 7443 ssl;
    # ssl_certificate     /path/to/cert.pem;
    # ssl_certificate_key /path/to/cert.key;

    # ---- 屏蔽 .git 与所有点文件（部署目录若含 .git，防止任何人下载对象库）----
    # 正则 location 优先级高于前缀 location，可拦截 /api/md/.hidden 等点文件请求
    location ~ /\.(?!well-known) {
        deny all;
    }

    # ---- API 端点：文件列表（nginx autoindex，由前端 JS 解析）----
    # 注意：autoindex 会列出目录下全部文件（含未发布草稿），
    # 建议未发布内容放在 web root 之外（audit D15）。
    location /api/html/ {
        alias /path/to/Blog-termux/Html/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        charset utf-8;
    }

    location /api/md/ {
        alias /path/to/Blog-termux/Markdown/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        charset utf-8;
    }

    location /api/images/ {
        alias /path/to/Blog-termux/Image/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        charset utf-8;
    }

    # ---- 仪表盘数据（由 cron.sh 定时生成；= 精确匹配避免前缀拼出怪异 404）----
    location = /api/dashboard {
        alias /path/to/Blog-termux/dashboard.json;
        default_type application/json;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # ---- 服务导航配置 ----
    location /config.json {
        alias /path/to/Blog-termux/config.json;
        default_type application/json;
    }

    # ---- Service Worker 与入口页：不缓存（浏览器对 SW 有 24h 强制重查上限）----
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # ---- 前端：单页应用（JS/CSS 通过 ?v=N 破坏缓存）----
    location / {
        root /path/to/Blog-termux/;
        index index.html;
        charset utf-8;
    }
}